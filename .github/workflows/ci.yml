name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: ShellCheck
        uses: ludeeus/action-shellcheck@00b27aa7cb85167568cb48a3838b75f4265f2bca
        with:
          severity: warning
          ignore_paths: ./lib/paths.sh
          ignore_names: paths.sh
          format: gcc

  bash-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check bash syntax
        run: |
          for f in zapret-sonar zapret-sonar-tui install.sh lib/*.sh contrib/*.sh tests/*.sh scripts/*.sh; do
            echo ":: Checking $f"
            bash -n "$f" || exit 1
          done

  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run smoke test
        run: bash tests/smoke-translate.sh

      - name: Test Flowseal staging
        run: bash tests/flowseal-tree.sh

      - name: Test runtime safety
        run: bash tests/runtime-safety.sh

      - name: Test update transaction
        run: bash tests/update-transaction.sh

      - name: Test apply lifecycle
        run: bash tests/apply-lifecycle.sh

      - name: Test engine upgrade
        run: bash tests/engine-upgrade.sh

      - name: Test artifact validation
        run: bash tests/artifact-validation.sh

      - name: Test JSON contracts
        run: bash tests/json-contracts.sh

      - name: Test diagnostic export
        run: bash tests/diagnostic-export.sh

      - name: Test strategy validation
        run: bash tests/validate.sh

      - name: Test self-update primitives
        run: bash tests/self-update.sh

      - name: Test self-update command
        run: bash tests/self-update-command.sh

      - name: Test Flowseal rollback
        run: bash tests/flowseal-rollback.sh

      - name: Test installer CLI
        run: bash tests/installer-cli.sh

      - name: Test reinstall migration
        run: bash tests/install-migration.sh

      - name: Test pinned Flowseal release
        run: bash tests/flowseal-release.sh

      - name: Build release asset
        run: bash scripts/build-release.sh dist
