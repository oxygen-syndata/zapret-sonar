name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          severity: warning
          ignore_paths: ./lib/paths.sh
          ignore_names: paths.sh
          format: gcc

  bash-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check bash syntax
        run: |
          for f in zapret-sonar zapret-sonar-tui install.sh lib/*.sh; do
            echo ":: Checking $f"
            bash -n "$f" || exit 1
          done

  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run smoke test
        run: bash tests/smoke-translate.sh

      - name: Test Flowseal staging
        run: bash tests/flowseal-tree.sh

      - name: Test runtime safety
        run: bash tests/runtime-safety.sh

      - name: Test update transaction
        run: bash tests/update-transaction.sh

      - name: Test reinstall migration
        run: bash tests/install-migration.sh

      - name: Test pinned Flowseal release
        run: bash tests/flowseal-release.sh
