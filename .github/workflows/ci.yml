name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: ShellCheck
        uses: ludeeus/action-shellcheck@00b27aa7cb85167568cb48a3838b75f4265f2bca
        with:
          severity: warning
          ignore_paths: ./lib/paths.sh
          ignore_names: paths.sh
          format: gcc

  bash-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Check bash syntax
        run: |
          for f in zapret-sonar zapret-sonar-tui install.sh lib/*.sh contrib/*.sh tests/*.sh scripts/*.sh; do
            echo ":: Checking $f"
            bash -n "$f" || exit 1
          done

  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Run regression and integration tests
        run: |
          for test in tests/*.sh; do
            bash "$test" || exit 1
          done

      - name: Build release asset
        run: |
          bash scripts/build-release.sh dist
          (cd dist && sha256sum -c SHA256SUMS)
